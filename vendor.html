<!DOCTYPE html>
<html lang="en">
<head>
   
    <script>
    // Check if user is logged in
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user) {
        window.location.href = 'login.html';
    }
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Portal - Global Marketplace </title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
<a href="#" id="logoutBtn" style="color: #d9534f; font-weight: bold;">Logout</a>
    <!-- Navigation -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-indigo-600">🏪 Vendor Portal</h1>
            <<div class="flex items-center space-x-6">
        <a href="index.html" class="text-indigo-600 font-semibold">Storefront</a>
        <a href="vendor.html" class="text-gray-600 hover:text-indigo-600 font-medium">Vendor Dashboard</a>
        <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
            Logout
        </button>
    </div>
    </nav>

    <!-- Main Dashboard -->
    <main class="max-w-2xl mx-auto px-6 py-12">
        <div class="bg-white border border-gray-200 rounded-2xl shadow-sm p-8">
            <h2 class="text-2xl font-bold mb-2">Publish New Product</h2>
            <p class="text-gray-500 mb-6">List your product for buyers worldwide to see instantly.</p>

            <form id="product-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Vendor ID (from database)</label>
                    <input type="number" id="vendor_id" required placeholder="e.g., 1" class="...">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Product Title</label>
                    <input type="text" id="title" required placeholder="Handmade Ceramic Mug" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                    <textarea id="description" rows="3" placeholder="Describe materials, sizing, and details..." class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                </div>
               <div class="mb-4">
    <label class="block text-sm font-medium text-gray-700 mb-1">Price (PHP / ₱)</label>
    <input type="text" id="price" required placeholder="1,100" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500">
</div>

<div class="mb-4">
    <label class="block text-sm font-medium text-gray-700 mb-1">Product Link (Your Store/Website URL)</label>
    <input type="url" id="product_link" required placeholder="https://your-store.com/product" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500">
</div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Image URL</label>
                    <input type="url" id="image_url" placeholder="https://images.unsplash.com/..." class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white font-medium py-3 rounded-lg hover:bg-indigo-700 transition">Publish to Marketplace</button>
            </form>
            <div id="form-message" class="mt-4 text-center text-sm font-medium"></div>
        </div>
    </main>
<div class="mt-6 text-center">
   <button id="clear-btn" class="bg-red-500 hover:bg-red-600 text-white text-sm font-medium py-2 px-4 rounded-lg transition">
        Clear All Marketplace Products
    </button>
</div>

   <script>
    document.addEventListener("DOMContentLoaded", () => {
        // 1. Handle Product Publishing Form
        const productForm = document.getElementById('product-form');
        if (productForm) {
            productForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const msg = document.getElementById('form-message');

                const payload = {
                    vendor_id: document.getElementById('vendor_id').value,
                    title: document.getElementById('title').value,
                    description: document.getElementById('description').value,
                    price: document.getElementById('price').value.replace(/,/g, ''),
                    product_link: document.getElementById('product_link').value,
                    image_url: document.getElementById('image_url').value
                };

                try {
                    const res = await fetch('http://localhost:5000/api/products', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const data = await res.json();
                    if (res.ok) {
                        msg.textContent = "Success! Product is now live on the storefront.";
                        msg.className = "mt-4 text-center text-green-600 font-medium";
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1500);
                    } else {
                        msg.textContent = "Error: " + data.error;
                        msg.className = "mt-4 text-center text-red-600 font-medium";
                    }
                } catch (err) {
                    console.error('Publish error:', err);
                    msg.textContent = "Failed to connect to server.";
                    msg.className = "mt-4 text-center text-red-600 font-medium";
                }
            });
        }

        // 2. Auto-format price input with commas as you type
        const priceInput = document.getElementById('price');
        if (priceInput) {
            priceInput.addEventListener('input', (e) => {
                let value = e.target.value.replace(/[^0-9.]/g, '');
                let parts = value.split('.');
                let integerPart = parts[0];
                let decimalPart = parts.length > 1 ? '.' + parts[1] : '';
                
                if (integerPart) {
                    integerPart = Number(integerPart).toLocaleString('en-US');
                }
                
                e.target.value = integerPart + decimalPart;
            });
        }

        // 3. Handle Clearing All Products
        const clearBtn = document.getElementById('clear-btn');
        if (clearBtn) {
            clearBtn.addEventListener('click', async () => {
                if (!confirm('Are you sure you want to clear all products from the marketplace?')) return;
                
                try {
                    const res = await fetch('http://localhost:5000/api/products', { method: 'DELETE' });
                    const data = await res.json();
                    if (res.ok) {
                        alert('All products cleared successfully!');
                        location.reload();
                    } else {
                        alert('Error: ' + data.error);
                    }
                } catch (err) {
                    console.error('Clear error:', err);
                    alert('Failed to connect to server.');
                }
            });
        }
    });
</script>
    <script src="script.js"></script>
    <script>
    document.getElementById('logoutBtn').addEventListener('click', (e) => {
        e.preventDefault();
        localStorage.removeItem('userId');
        localStorage.removeItem('userRole');
        localStorage.removeItem('userName');
        window.location.href = 'login.html';
    });
</script>
</body>
</html>
